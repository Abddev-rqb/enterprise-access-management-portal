spring:
  application:
    name: accessportal

  datasource:
    url: jdbc:postgresql://localhost:5432/accessportal_db
    username: accessportal_user
    password: accessportal_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: MjVmNThhMGY4YjZkNGM3YTllMWYzYjVkN2M5YTFlNGY2YjhkMGMyYTRlNmY4YjBkMWMzYTVlN2Y5YjFkMmM0
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
